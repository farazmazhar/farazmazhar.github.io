projects:
  heading: "Featured projects"
  description: "Flagship platforms I designed and built from scratch."
  filter_prefix: "Showing projects that use"
  filter_clear: "Show all projects"
  items:
    - category: "Agentic AI"
      title: "PartnerLinq - Agentic Framework"
      # 3–4 short stage names drawn as a small architecture sketch.
      flow: ["Request", "Supervisor", "Agents", "Answer"]
      description: "A metadata-driven framework for building and running a fleet of AI agents. Each agent's bespoke logic lives in its own module, while shared behavior — registration, configuration, invocation, and runtime observability — is driven by metadata, so onboarding a new agent is a focused implementation plus configuration. Its centerpiece is a **dynamic orchestrator** that composes workflows at runtime from the **capabilities** agents advertise, solving problems no pre-defined workflow covers."
      subindustry:
        - "Agent Orchestration"
        - "Framework"
        - "Multi-Agent"
      tags:
        - "Orchestration"
        - "Metadata-Driven"
        - "Dynamic Workflows"
        - "Capability Model"
        - "Platform"
      url: "#"
    - category: "Data engineering"
      title: "PartnerLinq - Data Framework"
      flow: ["Ingest", "Canonical", "Semantic", "Serve"]
      description: "A metadata-driven Spark framework on Databricks that runs the platform's full data lifecycle across 20+ independently deployable modules. Transformations live entirely in metadata: a JSON DSL engine compiles recursive operation trees to Spark at runtime on top of **canonical** and **semantic** model layers, so a new tenant needs configuration, not code. Also handles ML orchestration, policy enforcement, lineage tracking, and materialization."
      subindustry:
        - "Lakehouse"
        - "Data Fabric"
        - "MLOps"
      tags:
        - "Python"
        - "Apache Spark"
        - "Delta Lake"
        - "Azure Data Lake Storage"
        - "Azure Key Vault"
        - "SQL Server"
        - "Kafka"
        - "MLflow"
      url: "#"
    - category: "System integration"
      title: "PartnerLinq - Visibility - Integration API"
      flow: ["Client", "Gateway", "Tenant secrets", "Databricks"]
      description: "The multi-tenant gateway that routes jobs into Databricks pipelines with full tenant isolation, resolving each client's credentials from cloud secrets at runtime. One API covers ingestion, **canonical** runs and validation, serving, extraction, ML training, cloning, and archival — with idempotent job submission, process-flow lifecycle management, Kafka event propagation, and Azure Data Factory integration."
      subindustry:
        - "Pipeline Orchestration"
        - "iPaaS"
        - "API"
      tags:
        - "Python"
        - "Django"
        - "REST"
        - "Databricks SDK"
        - "Azure Key Vault"
        - "Azure Data Factory"
        - "Kafka"
        - "SQL Server"
      url: "#"
    - category: "Metadata API"
      title: "PartnerLinq - Visibility - Metadata API"
      flow: ["GraphQL / REST", "Metadata API", "Metastore"]
      description: "The platform's single source of truth for business data models, pipeline configuration, run history, and ML experiments. It serves two audiences: **GraphQL** for composable, typed queries from orchestration services, and **REST** CRUD endpoints for legacy clients — all backed by a multi-schema store spanning metastore, versioning, models, annotations, and lineage."
      subindustry:
        - "Lineage"
        - "API"
      tags:
        - "Python"
        - "Django"
        - "Strawberry GraphQL"
        - "Django REST Framework"
        - "SQL Server"
      url: "#"
    - category: "Analytics query engine"
      title: "PartnerLinq - Visibility - Query Builder"
      flow: ["Grid model", "SQL builder", "SQL Server"]
      description: "A metadata-driven SQL engine behind the platform's interactive grids and planning apps. It turns a grid model — columns, filters, sorts, run context — into parameterized SQL at request time, supporting pivots and group-bys, CTE chaining, time-series generation, run-to-run comparisons, optimistic row locking, and Excel export, all driven by feed metadata from the **semantic** catalog."
      subindustry:
        - "Data Application"
        - "API"
      tags:
        - "Python"
        - "Django"
        - "REST"
        - "PyPika"
        - "SQL Server"
      url: "#"

